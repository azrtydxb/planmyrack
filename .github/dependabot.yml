version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/app"
      - "/packages/catalog"
      - "/packages/core"
      - "/packages/server"
      - "/packages/storage"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
