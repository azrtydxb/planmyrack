name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Three-tier test model (azrtydxb/.github docs/ci-standard.md §Test tiers):
  # PR = fast unit/static tier; nightly + v* tag re-run the same suite as a
  # slower safety net (the repo has no service-backed integration job in CI yet).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # node:sqlite only stops warning that it is experimental at 24, and the server uses it directly.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Shared packages must not import react, react-native or expo
        run: npm run check:purity

      - name: Tests
        run: npm test

      - name: Web build
        run: npm run build:web
